      - name: Restore pinned Boost headers
        id: boost-cache
        if: steps.boost.outputs.mode == 'pinned'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/boost-pin
          key: boost-headers-${{ env.BOOST_PIN_VER }}-v1
      - name: Fetch pinned Boost headers
        if: steps.boost.outputs.mode == 'pinned' && steps.boost-cache.outputs.cache-hit != 'true'
        run: |
          v="$BOOST_PIN_VER"; d="boost_${v//./_}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$d.tar.gz" "https://archives.boost.io/release/$v/source/$d.tar.gz"
          got=$(shasum -a 256 "$RUNNER_TEMP/$d.tar.gz" | cut -d' ' -f1)
          if [ "$got" != "$BOOST_PIN_SHA256" ]; then
            python3 "$CIPY" ann error "job=$GITHUB_JOB step=boost sha256-mismatch got=$got"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/$d.tar.gz" -C "$RUNNER_TEMP" "$d/boost"
          mkdir -p "$HOME/boost-pin/include"
          mv "$RUNNER_TEMP/$d/boost" "$HOME/boost-pin/include/boost"
      - name: Install Homebrew Boost
        if: steps.boost.outputs.mode == 'brew'
        run: brew install boost
      - name: Restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-macos-${{ github.run_id }}-${{ github.run_attempt }}-test
          restore-keys: |
            ccache-macos-${{ github.run_id }}-
            ccache-macos-
      - name: Configure (Modelnet ON)
        id: configure
        env:
          BOOST_MODE: ${{ steps.boost.outputs.mode }}
        run: |
          prefix=$(brew --prefix)
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          args=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" -DWITH_MODELNET=ON
                -DWITH_ZMQ=ON -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DWITH_CCACHE=ON)
          if [ "$BOOST_MODE" = pinned ]; then args+=(-DBoost_INCLUDE_DIR="$HOME/boost-pin/include"); fi
          if ! xcrun -sdk macosx metal -v >/dev/null 2>&1; then args+=(-DBTX_MATMUL_METAL_PRECOMPILE_KERNELS=OFF); fi
          python3 "$CIPY" configure --name macos --job "$GITHUB_JOB" --logs "$LOGS" --builddir build -- "${args[@]}"
      - name: Build test_btx and the helpers it runs (keep going)
        timeout-minutes: 320
        run: |
          read -r -a targets <<< "$LINUX_TEST_TARGETS"
          python3 "$CIPY" build --name tests --logs "$LOGS" --builddir build -- -k 0 -j"$(sysctl -n hw.ncpu)" "${targets[@]}"
      - name: Build summary
        id: bsum
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          python3 "$CIPY" build-summary --name tests --job "$GITHUB_JOB" --logs "$LOGS" \
            --exe test_btx=build/bin/test_btx btxd=build/bin/btxd jail_probe=build/bin/test_swarm_jail_probe
      - name: Save ccache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-macos-${{ github.run_id }}-${{ github.run_attempt }}-test
      - name: Pack the binaries for the test jobs
        id: pack
        if: ${{ !cancelled() && steps.bsum.outputs.test_btx == 'yes' }}
        run: |
          tar -cf "$RUNNER_TEMP/macos-bin.tar" build/bin
          ls -la "$RUNNER_TEMP/macos-bin.tar"
          echo "bin=yes" >> "$GITHUB_OUTPUT"
      - name: Upload the binaries
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-bin
          path: ${{ runner.temp }}/macos-bin.tar
          retention-days: 3
          overwrite: true
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-macos-tests-build
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # First run = measurement: the macOS gates do not fail the workflow until they have been green once.
  macos-unit:
    name: macos-unit (${{ matrix.shard }}/3)
    needs: [tools, macos-tests-build]
    if: ${{ !cancelled() && needs.macos-tests-build.outputs.bin == 'yes' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-15
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 355
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-bin
          path: ${{ runner.temp }}
      - name: Unpack the binaries and install the runtime libraries
        run: |
          tar -xf "$RUNNER_TEMP/macos-bin.tar" && rm -f "$RUNNER_TEMP/macos-bin.tar"
          brew install libevent zeromq libomp openssl@3
      - name: Shard ${{ matrix.shard }}/3 of test_btx (balanced by measured seconds, 2 at a time, 900 s per suite)
        env:
          OMP_NUM_THREADS: "2"
          OMP_WAIT_POLICY: "PASSIVE"
        run: |
          python3 "$CIPY" suites --bin build/bin/test_btx --label "mac-unit-${{ matrix.shard }}" --job "$GITHUB_JOB" \
            --out "$LOGS/units" --include . --exclude "$UNIT_EXCLUDE" --serial '^pq_timing_tests$' \
            --shard "${{ matrix.shard }}/3" --shard-costs contrib/ci-fork/unit-suite-seconds.tsv \
            --jobs 2 --timeout 900 --keep-logs --stop-at $((JOB_T0 + 340 * 60)) --stop-in 335 || true
      - name: Known-failing gate (not gating until macOS has been green once)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 "$CIPY" known --label "mac-unit-${{ matrix.shard }}" --known "$KNOWN" --out "$LOGS/gate" \
            --unit "$LOGS/units/results.tsv"
      - name: Upload results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-macos-unit-${{ matrix.shard }}
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  macos-swarm:
    name: macos-swarm
    needs: [tools, macos-tests-build]
    if: ${{ !cancelled() && needs.macos-tests-build.outputs.bin == 'yes' }}
    runs-on: macos-15
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 100
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-bin
          path: ${{ runner.temp }}
      - name: Unpack the binaries and install the runtime libraries
        run: |
          tar -xf "$RUNNER_TEMP/macos-bin.tar" && rm -f "$RUNNER_TEMP/macos-bin.tar"
          brew install libevent zeromq libomp openssl@3
      - name: swarm_confine_tests and swarm_fsjail_tests, Seatbelt, n=3
        timeout-minutes: 20
        run: |
          python3 "$CIPY" suites --bin build/bin/test_btx --label mac-confine-fsjail --job "$GITHUB_JOB" \
            --out "$LOGS/t-confine" --suites swarm_confine_tests,swarm_fsjail_tests --repeat 3 --jobs 1 \
            --timeout 900 --per-suite --keep-logs --stop-in 18
      - name: All swarm_* suites
        if: ${{ !cancelled() }}
        timeout-minutes: 70
        run: |
          python3 "$CIPY" suites --bin build/bin/test_btx --label mac-swarm --job "$GITHUB_JOB" \
            --out "$LOGS/t-swarm" --include '^swarm_' --exclude '^swarm_(confine|fsjail)_tests$' \
            --jobs 3 --timeout 900 --stop-at $((JOB_T0 + 95 * 60)) --stop-in 68
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-macos-swarm
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # 20 of the 191 matmul_v4_rc_stage3_* suites (every tenth by name), so the arm64 path is measured at
  # all. Report only; the stage3 suites are not gated anywhere in the hosted jobs.
  macos-stage3-sample:
    name: macos-stage3-sample
    needs: [tools, macos-tests-build]
    if: ${{ !cancelled() && needs.macos-tests-build.outputs.bin == 'yes' }}
    runs-on: macos-15
    timeout-minutes: 355
    continue-on-error: true
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-bin
          path: ${{ runner.temp }}
      - name: Unpack the binaries and install the runtime libraries
        run: |
          tar -xf "$RUNNER_TEMP/macos-bin.tar" && rm -f "$RUNNER_TEMP/macos-bin.tar"
          brew install libevent zeromq libomp openssl@3
      - name: Every tenth stage3 suite by name (2 at a time, 1800 s per suite)
        env:
          OMP_NUM_THREADS: "2"
          OMP_WAIT_POLICY: "PASSIVE"
        run: |
          python3 "$CIPY" suites --bin build/bin/test_btx --label mac-stage3-sample --job "$GITHUB_JOB" \
            --out "$LOGS/stage3" --include "$UNIT_EXCLUDE" --shard 1/10 --jobs 2 --timeout 1800 --per-suite \
            --max-notices 9 --stop-at $((JOB_T0 + 340 * 60)) --stop-in 335
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-macos-stage3-sample
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # ------------------------------------------------------------------ release tooling and the verdict
  release-gate:
    name: release-gate
    needs: tools
    if: ${{ !cancelled() && needs.tools.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: The release tooling's own tests (package, verify, cut, the ZMQ gate)
        run: |
          mkdir -p "$LOGS/release/logs"
          : > "$LOGS/release/lint-results.tsv"
          for t in test/util/*release*_test.py; do
            n="release:$(basename "$t")"
            t0=$(date +%s)
            rc=0
            python3 "$t" > "$LOGS/release/logs/$(basename "$t").log" 2>&1 || rc=$?
            st=pass
            [ "$rc" -eq 0 ] || st=fail
            printf '%s\t%s\t%s\n' "$n" "$st" "$(( $(date +%s) - t0 ))" | tee -a "$LOGS/release/lint-results.tsv"
          done
      - name: Known-failing gate
        if: ${{ !cancelled() }}
        run: |
          python3 "$CIPY" known --label release-gate --known "$KNOWN" --out "$LOGS/gate" --lint "$LOGS/release/lint-results.tsv"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: res-release-gate
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  summary:
    name: summary
    needs: [tools, lint, clang-tidy-diff, cppcheck, linux-build, linux-unit, linux-functional, linux-userns, release-gate]
    if: ${{ !cancelled() && needs.tools.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Start
        run: |
          {
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: res-*
          path: res
      - name: Job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          rows = "".join(f"| {k} | {v.get('result')} |\n" for k, v in needs.items())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Linux and static jobs\n\n| job | result |\n|---|---|\n" + rows + "\n")
          print(rows)
          bad = sorted(k for k, v in needs.items() if v.get("result") != "success")
          print(f"::{'error' if bad else 'notice'} title=RESULT::gating jobs not green: {','.join(bad) or 'none'}")
          raise SystemExit(1 if bad else 0)
          PY
      - name: One known-failing verdict over every Linux result; the next known-failing list
        if: ${{ !cancelled() }}
        run: |
          python3 "$CIPY" known --label all-linux --known "$KNOWN" --out "$LOGS/gate" \
            --unit 'res/res-linux-unit-*/units/results.tsv' 'res/res-linux-unit-*/retry/results.tsv' \
            --junit 'res/res-linux-build/ctest-extra.xml' \
            --functional 'res/res-linux-func-*/func/functional-results.csv' \
            --lint 'res/res-lint/lint/lint-results.tsv' 'res/res-release-gate/release/lint-results.tsv'
      - name: Upload the verdict and the next known-failing list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: known-failing-next
          path: ${{ runner.temp }}/logs/gate
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore
