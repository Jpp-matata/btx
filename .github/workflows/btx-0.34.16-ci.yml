  linux-userns:
    name: linux-userns
    needs: [tools, linux-build]
    if: ${{ !cancelled() && needs.linux-build.outputs.bin == 'yes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-bin
          path: ${{ runner.temp }}
      - name: Unpack the binaries and install the runtime libraries
        run: |
          tar -xf "$RUNNER_TEMP/linux-bin.tar" && rm -f "$RUNNER_TEMP/linux-bin.tar"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libevent-dev libsqlite3-dev libzmq3-dev
      - name: Enable unprivileged user namespaces and check them with unshare -Ur true
        continue-on-error: true
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          python3 "$CIPY" userns --job "$GITHUB_JOB"
      - name: swarm_confine_tests and swarm_fsjail_tests, real user namespaces, no shim, n=3
        timeout-minutes: 20
        run: |
          python3 "$CIPY" suites --bin build/bin/test_btx --label linux-confine-fsjail --job "$GITHUB_JOB" \
            --out "$LOGS/t-confine" --suites swarm_confine_tests,swarm_fsjail_tests --repeat 3 --jobs 1 \
            --timeout 900 --per-suite --keep-logs --stop-in 18
      - name: guard_permit, native_discovery and the jail callers
