  # ------------------------------------------------------------------ mingw-w64 (cross, on Linux)
  mingw-cross:
    name: mingw-cross
    needs: tools
    runs-on: ubuntu-24.04
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 350
    outputs:
      btxd: ${{ steps.bsum.outputs.btxd }}
    env:
      HOSTW: x86_64-w64-mingw32
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
            echo "CCACHE_DIR=$HOME/.ccache-btx"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -n 1
      - name: Install the mingw-w64 toolchain (posix threads)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev make cmake ninja-build curl patch pkgconf python3 ccache \
            xz-utils autoconf automake libtool
          for t in gcc g++; do
            if [ -e "/usr/bin/$HOSTW-$t-posix" ]; then
              sudo update-alternatives --set "$HOSTW-$t" "/usr/bin/$HOSTW-$t-posix" || true
            fi
          done
          tm=$("$HOSTW-g++" -v 2>&1 | grep -i 'thread model' | tr ' ' '-')
          python3 "$CIPY" ann notice "job=$GITHUB_JOB step=toolchain $("$HOSTW-g++" --version | head -n 1 | tr ' ' '-') $tm"
      - name: Restore depends prefix
        id: dep-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: depends/x86_64-w64-mingw32
          key: depends-mingw-v1-${{ hashFiles('depends/**') }}-ossl-${{ env.OSSL_VER }}
      - name: Build depends and static OpenSSL for mingw
        id: dep-build
        if: steps.dep-cache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: |
          t0=$(date +%s)
          make -C depends HOST="$HOSTW" NO_QT=1 NO_QR=1 NO_UPNP=1 NO_USDT=1 NO_BDB=1 -j"$(nproc)" > "$LOGS/depends.log" 2>&1 || {
            tail -n 60 "$LOGS/depends.log"
            python3 "$CIPY" ann error "job=$GITHUB_JOB step=depends status=fail"
            exit 1
          }
          PFX="$GITHUB_WORKSPACE/depends/$HOSTW"
          cd "$RUNNER_TEMP"
          u="https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz"
          curl -fsSL --retry 3 -o ossl.tar.gz "$u"
          got=$(sha256sum ossl.tar.gz | cut -d' ' -f1)
          if [ "$got" != "$OSSL_SHA256" ]; then
            python3 "$CIPY" ann error "job=$GITHUB_JOB step=openssl-mingw sha256-mismatch got=$got"
            exit 1
          fi
          tar xzf ossl.tar.gz
          cd "openssl-$OSSL_VER"
          perl Configure mingw64 --cross-compile-prefix="$HOSTW-" --prefix="$PFX" --libdir=lib \
            no-shared no-tests no-docs no-apps > "$LOGS/ossl-w-configure.log" 2>&1
          make -j"$(nproc)" > "$LOGS/ossl-w-make.log" 2>&1
          make install_sw > "$LOGS/ossl-w-install.log" 2>&1
          built=$(cd "$GITHUB_WORKSPACE/depends/built/$HOSTW" 2>/dev/null && printf '%s,' *)
          python3 "$CIPY" ann notice "job=$GITHUB_JOB step=depends status=ok secs=$(( $(date +%s) - t0 )) openssl=$OSSL_VER sha256=pinned-match built=$built"
      - name: Save depends prefix
        if: steps.dep-build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: depends/x86_64-w64-mingw32
          key: ${{ steps.dep-cache.outputs.cache-primary-key }}
      - name: Restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-mingw-${{ github.run_id }}-${{ github.run_attempt }}-build
          restore-keys: |
            ccache-mingw-${{ github.run_id }}-
            ccache-mingw-
      - name: Configure (Modelnet ON)
        id: configure
        run: |
          PFX="$GITHUB_WORKSPACE/depends/$HOSTW"
          python3 "$CIPY" configure --name mingw --job "$GITHUB_JOB" --logs "$LOGS" --builddir build-win -- \
            -S . -B build-win -G Ninja --toolchain "$PFX/toolchain.cmake" -DCMAKE_BUILD_TYPE=Release \
            -DWITH_MODELNET=ON -DOPENSSL_ROOT_DIR="$PFX" -DOPENSSL_USE_STATIC_LIBS=ON -DBUILD_TESTS=ON -DBUILD_GUI=OFF \
            -DBUILD_BENCH=OFF -DWITH_ZMQ=ON -DWITH_CCACHE=ON -DREDUCE_EXPORTS=ON -DBUILD_GUI_TESTS=OFF \
            "-DCMAKE_CXX_FLAGS=-Wno-error=maybe-uninitialized -Wno-error=array-bounds"
      - name: Build btxd.exe and btx-cli.exe
        timeout-minutes: 260
        run: python3 "$CIPY" build --name daemon --logs "$LOGS" --builddir build-win -- -k 0 -j"$(nproc)" btxd btx-cli
      - name: Build summary
        id: bsum
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          python3 "$CIPY" build-summary --name daemon --job "$GITHUB_JOB" --logs "$LOGS" \
            --exe btxd=build-win/bin/btxd.exe btx_cli=build-win/bin/btx-cli.exe
      - name: Save ccache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-mingw-${{ github.run_id }}-${{ github.run_attempt }}-build
      - name: Package the daemon and its DLLs
        if: ${{ !cancelled() && steps.bsum.outputs.btxd == 'yes' }}
        run: |
          mkdir -p dist-daemon
          cp build-win/bin/btxd.exe dist-daemon/
          [ -f build-win/bin/btx-cli.exe ] && cp build-win/bin/btx-cli.exe dist-daemon/
          "$HOSTW-strip" dist-daemon/*.exe
          python3 "$CIPY" dlls --job "$GITHUB_JOB" --objdump "$HOSTW-objdump" --dest dist-daemon \
            --search "/usr/lib/gcc/$HOSTW/*-posix" "/usr/$HOSTW/lib" "/usr/$HOSTW/bin" \
            --exe dist-daemon/btxd.exe dist-daemon/btx-cli.exe
          (cd dist-daemon && sha256sum ./* > SHA256SUMS.txt)
      - name: Upload the daemon
        if: ${{ !cancelled() && steps.bsum.outputs.btxd == 'yes' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: win-daemon
          path: dist-daemon/
          retention-days: 7
          overwrite: true
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-mingw-cross
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  mingw-tests:
    name: mingw-tests
    needs: [tools, mingw-cross]
    if: ${{ !cancelled() && needs.tools.result == 'success' }}
    runs-on: ubuntu-24.04
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 355
    outputs:
      test_btx: ${{ steps.bsum.outputs.test_btx }}
    env:
      HOSTW: x86_64-w64-mingw32
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
            echo "CCACHE_DIR=$HOME/.ccache-btx"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -n 1
      - name: Install the mingw-w64 toolchain (posix threads)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev make cmake ninja-build curl patch pkgconf python3 ccache \
            xz-utils autoconf automake libtool
          for t in gcc g++; do
            if [ -e "/usr/bin/$HOSTW-$t-posix" ]; then
              sudo update-alternatives --set "$HOSTW-$t" "/usr/bin/$HOSTW-$t-posix" || true
            fi
          done
      - name: Restore depends prefix
        id: dep-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: depends/x86_64-w64-mingw32
          key: depends-mingw-v1-${{ hashFiles('depends/**') }}-ossl-${{ env.OSSL_VER }}
      - name: Build depends and static OpenSSL for mingw
        if: steps.dep-cache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: |
          make -C depends HOST="$HOSTW" NO_QT=1 NO_QR=1 NO_UPNP=1 NO_USDT=1 NO_BDB=1 -j"$(nproc)" > "$LOGS/depends.log" 2>&1
          PFX="$GITHUB_WORKSPACE/depends/$HOSTW"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o ossl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz"
          got=$(sha256sum ossl.tar.gz | cut -d' ' -f1)
          [ "$got" = "$OSSL_SHA256" ] || { python3 "$CIPY" ann error "job=$GITHUB_JOB step=openssl-mingw sha256-mismatch got=$got"; exit 1; }
          tar xzf ossl.tar.gz
          cd "openssl-$OSSL_VER"
          perl Configure mingw64 --cross-compile-prefix="$HOSTW-" --prefix="$PFX" --libdir=lib \
            no-shared no-tests no-docs no-apps > "$LOGS/ossl-w-configure.log" 2>&1
          make -j"$(nproc)" > "$LOGS/ossl-w-make.log" 2>&1
          make install_sw > "$LOGS/ossl-w-install.log" 2>&1
      - name: Restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-mingw-${{ github.run_id }}-${{ github.run_attempt }}-test
          restore-keys: |
            ccache-mingw-${{ github.run_id }}-
            ccache-mingw-
      # Run 1's link failure was not caused by the prune: key_tests.cpp includes <secp256k1.h>, and
      # test_btx takes secp256k1's include directories but not its SECP256K1_STATIC definition, so on
      # Windows the calls become __imp_secp256k1_* imports that the static library does not provide.
      # CI-only edit, before configure, so pass 1 already compiles with it.
      - name: CI-only edit - give test_btx secp256k1's interface definitions (SECP256K1_STATIC)
        run: python3 "$CIPY" test-defs --src . --target test_btx --job "$GITHUB_JOB"
      - name: Configure (Modelnet ON)
        id: configure
        run: |
          PFX="$GITHUB_WORKSPACE/depends/$HOSTW"
          python3 "$CIPY" configure --name mingw --job "$GITHUB_JOB" --logs "$LOGS" --builddir build-win -- \
            -S . -B build-win -G Ninja --toolchain "$PFX/toolchain.cmake" -DCMAKE_BUILD_TYPE=Release \
            -DWITH_MODELNET=ON -DOPENSSL_ROOT_DIR="$PFX" -DOPENSSL_USE_STATIC_LIBS=ON -DBUILD_TESTS=ON -DBUILD_GUI=OFF \
            -DBUILD_BENCH=OFF -DWITH_ZMQ=ON -DWITH_CCACHE=ON -DREDUCE_EXPORTS=ON -DBUILD_GUI_TESTS=OFF \
            "-DCMAKE_CXX_FLAGS=-Wno-error=maybe-uninitialized -Wno-error=array-bounds"
      - name: Build test_btx.exe, pass 1 (keep going)
        timeout-minutes: 230
        run: python3 "$CIPY" build --name tests1 --logs "$LOGS" --builddir build-win -- -k 0 -j"$(nproc)" test_btx btxd btx-cli
      - name: Pass 1 summary
        id: p1sum
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: python3 "$CIPY" build-summary --name tests1 --job "$GITHUB_JOB" --logs "$LOGS" --exe test_btx_pass1=build-win/bin/test_btx.exe
      - name: Drop the test files that do not compile with mingw (CI-only edit of the test list)
        id: prune
        if: ${{ !cancelled() && steps.configure.outcome == 'success' && steps.p1sum.outputs.test_btx_pass1 != 'yes' }}
        run: python3 "$CIPY" prune --log "$LOGS/build-tests1.log" --src . --target test_btx --logs "$LOGS" --job "$GITHUB_JOB"
      # relink links again. If the link fails because kept test files use code that lives only in pruned
      # ones, it drops those test files too and links again (up to 5 rounds). It drops nothing, and
      # reports, if a library or an __imp_ (dllimport) symbol is undefined.
      - name: Build test_btx.exe, pass 2 (relink; also drop the test files that use code from pruned ones)
        id: relink
        if: ${{ !cancelled() && steps.prune.outcome == 'success' && steps.prune.outputs.pruned != '0' }}
        timeout-minutes: 40
        run: |
          python3 "$CIPY" relink --name tests2 --job "$GITHUB_JOB" --logs "$LOGS" --builddir build-win --src . \
            --target test_btx --rounds 5 -- -k 0 -j"$(nproc)" test_btx
      - name: Build summary
        id: bsum
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          name=tests1
          [ -f "$LOGS/build-tests2.t0" ] && name=tests2
          python3 "$CIPY" build-summary --name "$name" --job "$GITHUB_JOB" --logs "$LOGS" \
            --exe test_btx=build-win/bin/test_btx.exe btxd_tests_job=build-win/bin/btxd.exe
      - name: Save ccache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-mingw-${{ github.run_id }}-${{ github.run_attempt }}-test
      - name: Package test_btx.exe and its DLLs
        if: ${{ !cancelled() && steps.bsum.outputs.test_btx == 'yes' }}
        run: |
          mkdir -p dist-tests
          cp build-win/bin/test_btx.exe dist-tests/
          "$HOSTW-strip" dist-tests/test_btx.exe
          python3 "$CIPY" dlls --job "$GITHUB_JOB" --objdump "$HOSTW-objdump" --dest dist-tests \
            --search "/usr/lib/gcc/$HOSTW/*-posix" "/usr/$HOSTW/lib" "/usr/$HOSTW/bin" --exe dist-tests/test_btx.exe
          [ -f "$LOGS/pruned.txt" ] && cp "$LOGS/pruned.txt" dist-tests/
          (cd dist-tests && sha256sum ./* > SHA256SUMS.txt)
      - name: Upload test_btx.exe
        if: ${{ !cancelled() && steps.bsum.outputs.test_btx == 'yes' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: win-tests
          path: dist-tests/
          retention-days: 7
          overwrite: true
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-mingw-tests
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # ------------------------------------------------------------------ Windows (native run of the mingw binaries)
  windows-smoke:
    name: windows-smoke
    needs: [tools, mingw-cross]
    if: ${{ !cancelled() && needs.mingw-cross.outputs.btxd == 'yes' }}
    runs-on: windows-latest
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 60
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: win-daemon
          path: bin
      # btx_ci.py smoke writes regtest=1 to <datadir>/btx.conf, passes the same -datadir and -regtest to btxd
      # and btx-cli, and waits for <datadir>\regtest\.cookie before the first RPC (run 1 lost that race).
      # The four -regtestmatmul* flags keep MatMul v4 off on this regtest chain, as the tester guide does:
      # without them block 100 is the first v4 block and a CPU did not find it in 6.5 minutes.
      - name: Regtest smoke with -modelnet=0 -matmulvalidation=economic (start, wallet, 101 blocks, send to self, stop)
        timeout-minutes: 30
        run: |
          ls -la bin
          python "$CIPY" smoke --btxd bin/btxd.exe --cli bin/btx-cli.exe --datadir "$RUNNER_TEMP/smoke-mende" \
            --label win-mende --job "$GITHUB_JOB" --port 38333 --rpcport 38332 --wallet --mine 101 --mine-budget 900 \
            --send --extra=-modelnet=0 --extra=-matmulvalidation=economic \
            --extra=-regtestmatmulbindingheight=2147483647 --extra=-regtestmatmulproductdigestheight=2147483647 \
            --extra=-regtestmatmulv4height=2147483647 --extra=-regtestmatmulrequireproductpayload=0 --out "$LOGS"
      - name: Regtest start with the default Modelnet (in-process swarm on, no btx-modeld.exe), 60 s, stop
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          python "$CIPY" smoke --btxd bin/btxd.exe --cli bin/btx-cli.exe --datadir "$RUNNER_TEMP/smoke-default" \
            --label win-default --job "$GITHUB_JOB" --port 38343 --rpcport 38342 --linger 60 --out "$LOGS"
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-windows-smoke
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  windows-tests:
    name: windows-tests
    needs: [tools, mingw-tests]
    if: ${{ !cancelled() && needs.mingw-tests.outputs.test_btx == 'yes' }}
    runs-on: windows-latest
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 100
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: win-tests
          path: bin
      - name: Test files left out of the mingw build
        run: |
          ls -la bin
          if [ -f bin/pruned.txt ]; then
            cl=$(awk '/^# test sources removed because they use/{s=1} /^# failed edges outside/{exit} /^src\//{if(s)l++; else c++} END{print c+0, l+0}' bin/pruned.txt)
            c=${cl% *}
            l=${cl#* }
            python "$CIPY" ann notice "job=$GITHUB_JOB step=pruned-count test_sources_not_built=$((c + l)) do_not_compile=$c use_pruned_code=$l (list in win-tests/pruned.txt and the mingw-tests annotations)"
          fi
      - name: swarm_confine_tests and swarm_fsjail_tests on Windows, n=3
        timeout-minutes: 15
        run: |
          python "$CIPY" suites --bin bin/test_btx.exe --label win-confine-fsjail --job "$GITHUB_JOB" \
            --out "$LOGS/t-confine" --suites swarm_confine_tests,swarm_fsjail_tests --repeat 3 --jobs 1 \
            --timeout 600 --per-suite --keep-logs --stop-in 13
      - name: All swarm_* suites on Windows (incl. the Windows sandbox and windowslife ones)
        if: ${{ !cancelled() }}
        timeout-minutes: 65
        run: |
          python "$CIPY" suites --bin bin/test_btx.exe --label win-swarm --job "$GITHUB_JOB" \
            --out "$LOGS/t-swarm" --include '^swarm_' --exclude '^swarm_(confine|fsjail)_tests$' \
            --jobs 4 --timeout 600 --stop-at $((JOB_T0 + 75 * 60)) --stop-in 63
      - name: Core and node suites on Windows
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          python "$CIPY" suites --bin bin/test_btx.exe --label win-core --job "$GITHUB_JOB" \
            --out "$LOGS/t-core" --suites "$CORE_SUITES" --jobs 4 --timeout 600 --keep-logs --stop-at $((JOB_T0 + 95 * 60)) --stop-in 18
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-windows-tests
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # ------------------------------------------------------------------ Windows native (clang-cl, MSVC STL, vcpkg x64-windows-static)
  # The repo's own preset windows-clangcl-static, overridden only by -D options (tests, Modelnet, ZMQ,
  # wallet, static OpenSSL 3.5.4). Every native job works under D:\w so no path gets near MAX_PATH.
  # msvc-run (btx_ci.py) runs a command inside the x64 Visual Studio environment, with LLVM first in PATH
  # and Strawberry Perl's MinGW tree dropped (its c\lib holds MinGW OpenSSL/SQLite builds).
  win-native-build:
    name: win-native-build
    needs: tools
    runs-on: windows-2025
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 355
    outputs:
      btxd: ${{ steps.bsum.outputs.btxd }}
    env:
      VCPKG_ROOT: 'D:\w\vcpkg'
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: 'clear;files,D:\w\vbc,readwrite'
      CCACHE_DIR: 'D:\w\ccache'
      MSYS_NO_PATHCONV: "1"
    steps:
      - name: Start (and keep checkout bytes, no CRLF conversion)
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs" /d/w/vbc /d/w/ccache
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: Toolchain identity (x64 VS environment, clang-cl, cmake, ninja, image)
        run: |
          t="$LOGS/toolchain.txt"
          {
            python "$CIPY" msvc-run --job "$GITHUB_JOB"
            python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-prepend 'C:\Program Files\LLVM\bin' --path-drop Strawberry -- clang-cl --version
            python "$CIPY" msvc-run --job "$GITHUB_JOB" -- cmake --version
            python "$CIPY" msvc-run --job "$GITHUB_JOB" -- ninja --version
          } > "$t" 2>&1
          cat "$t"
          python "$CIPY" ann notice "job=$GITHUB_JOB step=toolchain $(tr '\r\n' '  ' < "$t" | tr -s ' ' | cut -c1-500) image=${ImageOS:-?}/${ImageVersion:-?}"
      - name: ccache (official ${{ env.CCACHE_WIN_VER }} release zip, sha256 pinned)
        run: |
          z="ccache-$CCACHE_WIN_VER-windows-x86_64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$z.zip" "https://github.com/ccache/ccache/releases/download/v$CCACHE_WIN_VER/$z.zip"
          got=$(sha256sum "$RUNNER_TEMP/$z.zip" | cut -d' ' -f1)
          if [ "$got" != "$CCACHE_WIN_SHA256" ]; then
            python "$CIPY" ann error "job=$GITHUB_JOB step=ccache sha256-mismatch got=$got"
            exit 1
          fi
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/$z.zip" 'D:\w\ccache-bin'
          exe=$(find /d/w/ccache-bin -name ccache.exe | head -n 1)
          [ -n "$exe" ]
          cygpath -w "$(dirname "$exe")" >> "$GITHUB_PATH"
          echo "CCACHE_EXE=$(cygpath -m "$exe")" >> "$GITHUB_ENV"
          "$exe" --version | head -n 1
      - name: Restore OpenSSL
        id: ossl-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\ossl
          key: openssl-${{ env.OSSL_VER }}-win-vc-static-noasm-v1
      - name: Build static OpenSSL (VC-WIN64A no-shared no-asm, Strawberry Perl, nmake)
        id: ossl-build
        if: steps.ossl-cache.outputs.cache-hit != 'true'
        timeout-minutes: 90
        run: |
          cd "$RUNNER_TEMP"
          u="https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz"
          curl -fsSL --retry 3 -o ossl.tar.gz "$u"
          got=$(sha256sum ossl.tar.gz | cut -d' ' -f1)
          if [ "$got" != "$OSSL_SHA256" ]; then
            python "$CIPY" ann error "job=$GITHUB_JOB step=openssl-win sha256-mismatch got=$got"
            exit 1
          fi
          tar xzf ossl.tar.gz
          cd "openssl-$OSSL_VER"
          run() { python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-prepend 'C:\Strawberry\perl\bin' -- "$@"; }
          run 'C:\Strawberry\perl\bin\perl.exe' Configure VC-WIN64A no-shared no-tests no-docs no-asm \
            '--prefix=D:\w\ossl' '--openssldir=D:\w\ossl\ssl' --libdir=lib > "$LOGS/ossl-win-configure.log" 2>&1 \
            || { tail -n 60 "$LOGS/ossl-win-configure.log"; exit 1; }
          run nmake > "$LOGS/ossl-win-make.log" 2>&1 || { tail -n 60 "$LOGS/ossl-win-make.log"; exit 1; }
          run nmake install_sw > "$LOGS/ossl-win-install.log" 2>&1 || { tail -n 60 "$LOGS/ossl-win-install.log"; exit 1; }
          ls -la /d/w/ossl/lib
          python "$CIPY" ann notice "job=$GITHUB_JOB step=openssl-win built=$OSSL_VER sha256=pinned-match config=VC-WIN64A,no-shared,no-asm $(/d/w/ossl/bin/openssl.exe version | tr ' ' '-')"
      - name: Save OpenSSL
        if: steps.ossl-build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\ossl
          key: openssl-${{ env.OSSL_VER }}-win-vc-static-noasm-v1
      - name: vcpkg tool at the pinned commit (full clone; the manifest's builtin-baseline must be in its history)
        run: |
          if [ ! -d /d/w/vcpkg/.git ]; then git clone --no-checkout https://github.com/microsoft/vcpkg.git 'D:\w\vcpkg'; fi
          git -C 'D:\w\vcpkg' checkout --detach "$VCPKG_COMMIT"
          [ "$(git -C 'D:\w\vcpkg' rev-parse HEAD)" = "$VCPKG_COMMIT" ]
          base=$(python -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git -C 'D:\w\vcpkg' cat-file -e "$base^{commit}"
          python "$CIPY" msvc-run --job "$GITHUB_JOB" -- 'D:\w\vcpkg\bootstrap-vcpkg.bat' -disableMetrics
          python "$CIPY" ann notice "job=$GITHUB_JOB step=vcpkg commit=$VCPKG_COMMIT baseline=$base $(/d/w/vcpkg/vcpkg.exe version | head -n 1 | tr ' ' '-')"
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\vbc
          key: vcpkg-bin-win-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-win-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-bin-win-static-
      - name: Restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\ccache
          key: ccache-winnative-${{ github.run_id }}-${{ github.run_attempt }}-build
          restore-keys: |
            ccache-winnative-${{ github.run_id }}-
            ccache-winnative-
      - name: Configure (preset windows-clangcl-static; tests, Modelnet, wallet, ZMQ ON)
        id: configure
        run: |
          python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-prepend 'C:\Program Files\LLVM\bin' --path-drop Strawberry -- \
            python "$CIPY" configure --name winnative --job "$GITHUB_JOB" --logs "$LOGS" --builddir build -- \
            --preset windows-clangcl-static -S . -B build -DBUILD_TESTS=ON -DWITH_MODELNET=ON -DENABLE_WALLET=ON -DWITH_ZMQ=ON \
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON '-DVCPKG_MANIFEST_FEATURES=wallet;tests;zeromq' \
            -DVCPKG_INSTALLED_DIR=D:/w/vi -DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=D:/w/vbt \
            -DOPENSSL_ROOT_DIR=D:/w/ossl -DOPENSSL_USE_STATIC_LIBS=ON -DOPENSSL_MSVC_STATIC_RT=ON \
            -DOPENSSL_INCLUDE_DIR=D:/w/ossl/include -DOPENSSL_CRYPTO_LIBRARY=D:/w/ossl/lib/libcrypto.lib \
            -DOPENSSL_SSL_LIBRARY=D:/w/ossl/lib/libssl.lib "-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE_EXE" \
            "-DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_EXE" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\vbc
          key: vcpkg-bin-win-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
      - name: Build the daemon, CLI tools and btx-modeld (keep going)
        timeout-minutes: 290
        run: |
          read -r -a targets <<< "$WIN_NATIVE_TARGETS"
          python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-prepend 'C:\Program Files\LLVM\bin' --path-drop Strawberry -- \
            python "$CIPY" build --name daemon --logs "$LOGS" --builddir build -- -k 0 -j"$(nproc)" "${targets[@]}"
      - name: Build summary
        id: bsum
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          python "$CIPY" build-summary --name daemon --job "$GITHUB_JOB" --logs "$LOGS" \
            --exe btxd=build/bin/btxd.exe btx_cli=build/bin/btx-cli.exe btx_modeld=build/bin/btx-modeld.exe
      - name: Save ccache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\ccache
          key: ccache-winnative-${{ github.run_id }}-${{ github.run_attempt }}-build
      - name: Package the daemon (static build, so dumpbin should list system DLLs only)
        if: ${{ !cancelled() && steps.bsum.outputs.btxd == 'yes' }}
        run: |
          mkdir -p dist-daemon
          for x in btxd btx-cli btx-tx btx-util btx-modeld; do
            if [ -f "build/bin/$x.exe" ]; then cp "build/bin/$x.exe" dist-daemon/; fi
          done
          cp build/src/bitcoin-build-info.h dist-daemon/ || true
          python "$CIPY" msvc-run --job "$GITHUB_JOB" -- dumpbin /nologo /dependents dist-daemon/btxd.exe > dist-daemon/btxd-dependents.txt 2>&1 || true
          (cd dist-daemon && sha256sum ./* > SHA256SUMS.txt)
          python "$CIPY" ann notice "job=$GITHUB_JOB step=package dlls=$(grep -i '\.dll' dist-daemon/btxd-dependents.txt | tr -d ' \r' | tr '\n' ',' | cut -c1-300) $(grep -h 'BUILD_GIT' dist-daemon/bitcoin-build-info.h | tr -s ' ' | tr '\n' ' ')"
      - name: Upload the daemon
        if: ${{ !cancelled() && steps.bsum.outputs.btxd == 'yes' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: win-native-daemon
          path: dist-daemon/
          retention-days: 7
          overwrite: true
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-win-native-build
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  win-native-tests:
    name: win-native-tests
    needs: [tools, win-native-build]
    if: ${{ !cancelled() && needs.tools.result == 'success' }}
    runs-on: windows-2025
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 355
    outputs:
      test_btx: ${{ steps.bsum.outputs.test_btx }}
    env:
      VCPKG_ROOT: 'D:\w\vcpkg'
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: 'clear;files,D:\w\vbc,read'
      CCACHE_DIR: 'D:\w\ccache'
      MSYS_NO_PATHCONV: "1"
    steps:
      - name: Start (and keep checkout bytes, no CRLF conversion)
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs" /d/w/vbc /d/w/ccache
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: ccache (official ${{ env.CCACHE_WIN_VER }} release zip, sha256 pinned)
        run: |
          z="ccache-$CCACHE_WIN_VER-windows-x86_64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$z.zip" "https://github.com/ccache/ccache/releases/download/v$CCACHE_WIN_VER/$z.zip"
          got=$(sha256sum "$RUNNER_TEMP/$z.zip" | cut -d' ' -f1)
          if [ "$got" != "$CCACHE_WIN_SHA256" ]; then
            python "$CIPY" ann error "job=$GITHUB_JOB step=ccache sha256-mismatch got=$got"
            exit 1
          fi
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/$z.zip" 'D:\w\ccache-bin'
          exe=$(find /d/w/ccache-bin -name ccache.exe | head -n 1)
          [ -n "$exe" ]
          cygpath -w "$(dirname "$exe")" >> "$GITHUB_PATH"
          echo "CCACHE_EXE=$(cygpath -m "$exe")" >> "$GITHUB_ENV"
      - name: Restore OpenSSL
        id: ossl-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\ossl
          key: openssl-${{ env.OSSL_VER }}-win-vc-static-noasm-v1
      - name: Require the OpenSSL that win-native-build made
        run: |
          if [ ! -f /d/w/ossl/lib/libcrypto.lib ]; then
            python "$CIPY" ann error "job=$GITHUB_JOB step=openssl-win status=cache-missing (re-run win-native-build first)"
            exit 1
          fi
      - name: vcpkg tool at the pinned commit
        run: |
          if [ ! -d /d/w/vcpkg/.git ]; then git clone --no-checkout https://github.com/microsoft/vcpkg.git 'D:\w\vcpkg'; fi
          git -C 'D:\w\vcpkg' checkout --detach "$VCPKG_COMMIT"
          [ "$(git -C 'D:\w\vcpkg' rev-parse HEAD)" = "$VCPKG_COMMIT" ]
          python "$CIPY" msvc-run --job "$GITHUB_JOB" -- 'D:\w\vcpkg\bootstrap-vcpkg.bat' -disableMetrics
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\vbc
          key: vcpkg-bin-win-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-win-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-bin-win-static-
      - name: Restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\ccache
          key: ccache-winnative-${{ github.run_id }}-${{ github.run_attempt }}-test
          restore-keys: |
            ccache-winnative-${{ github.run_id }}-
            ccache-winnative-
      - name: Configure (identical to win-native-build, so ccache hits)
        id: configure
        run: |
          python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-prepend 'C:\Program Files\LLVM\bin' --path-drop Strawberry -- \
            python "$CIPY" configure --name winnative --job "$GITHUB_JOB" --logs "$LOGS" --builddir build -- \
            --preset windows-clangcl-static -S . -B build -DBUILD_TESTS=ON -DWITH_MODELNET=ON -DENABLE_WALLET=ON -DWITH_ZMQ=ON \
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON '-DVCPKG_MANIFEST_FEATURES=wallet;tests;zeromq' \
            -DVCPKG_INSTALLED_DIR=D:/w/vi -DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=D:/w/vbt \
            -DOPENSSL_ROOT_DIR=D:/w/ossl -DOPENSSL_USE_STATIC_LIBS=ON -DOPENSSL_MSVC_STATIC_RT=ON \
            -DOPENSSL_INCLUDE_DIR=D:/w/ossl/include -DOPENSSL_CRYPTO_LIBRARY=D:/w/ossl/lib/libcrypto.lib \
            -DOPENSSL_SSL_LIBRARY=D:/w/ossl/lib/libssl.lib "-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE_EXE" \
            "-DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_EXE" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build everything (default target, incl. test_btx; keep going)
        timeout-minutes: 300
        run: |
          python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-prepend 'C:\Program Files\LLVM\bin' --path-drop Strawberry -- \
            python "$CIPY" build --name all --logs "$LOGS" --builddir build -- -k 0 -j"$(nproc)"
      - name: Build summary
        id: bsum
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          python "$CIPY" build-summary --name all --job "$GITHUB_JOB" --logs "$LOGS" \
            --exe test_btx=build/bin/test_btx.exe btxd=build/bin/btxd.exe btx_modeld=build/bin/btx-modeld.exe btx_open=build/bin/btx-open.exe
          for f in build/bin/*.exe; do printf '%s ' "${f##*/}"; done > "$LOGS/exes.txt"
          python "$CIPY" ann notice "job=$GITHUB_JOB step=exes $(cat "$LOGS/exes.txt")"
      - name: Save ccache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\ccache
          key: ccache-winnative-${{ github.run_id }}-${{ github.run_attempt }}-test
      - name: Package build/bin (all executables; the shard jobs put it back at the same path)
        if: ${{ !cancelled() && steps.bsum.outputs.test_btx == 'yes' }}
        run: |
          mkdir -p dist-native
          cp build/bin/*.exe dist-native/
          cp build/src/bitcoin-build-info.h dist-native/ || true
          python "$CIPY" msvc-run --job "$GITHUB_JOB" -- dumpbin /nologo /dependents dist-native/test_btx.exe > dist-native/test_btx-dependents.txt 2>&1 || true
          (cd dist-native && sha256sum ./*.exe > SHA256SUMS.txt)
      - name: Upload build/bin
        if: ${{ !cancelled() && steps.bsum.outputs.test_btx == 'yes' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: win-native-bin
          path: dist-native/
          retention-days: 7
          overwrite: true
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-win-native-tests
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  win-native-smoke:
    name: win-native-smoke
    needs: [tools, win-native-build]
    if: ${{ !cancelled() && needs.win-native-build.outputs.btxd == 'yes' }}
    runs-on: windows-2025
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 60
    env:
      MSYS_NO_PATHCONV: "1"
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: win-native-daemon
          path: bin
      - name: Regtest smoke with -modelnet=0 (start, wallet, 101 blocks, send to self, stop)
        timeout-minutes: 30
        run: |
          ls -la bin
          python "$CIPY" smoke --btxd bin/btxd.exe --cli bin/btx-cli.exe --datadir "$RUNNER_TEMP/smoke-nomodel" \
            --label winnative-nomodel --job "$GITHUB_JOB" --port 38333 --rpcport 38332 --wallet --mine 101 --mine-budget 900 \
            --send --extra=-modelnet=0 --extra=-matmulvalidation=economic \
            --extra=-regtestmatmulbindingheight=2147483647 --extra=-regtestmatmulproductdigestheight=2147483647 \
            --extra=-regtestmatmulv4height=2147483647 --extra=-regtestmatmulrequireproductpayload=0 --out "$LOGS"
      - name: Regtest start with the default Modelnet, no btx-modeld.exe next to btxd.exe, 60 s, stop
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          mkdir -p nohelper && cp bin/btxd.exe bin/btx-cli.exe nohelper/
          python "$CIPY" smoke --btxd nohelper/btxd.exe --cli nohelper/btx-cli.exe --datadir "$RUNNER_TEMP/smoke-nohelper" \
            --label winnative-nohelper --job "$GITHUB_JOB" --port 38343 --rpcport 38342 --linger 60 \
            --capture getmodelnetworkinfo --out "$LOGS"
      - name: Regtest start with the default Modelnet, btx-modeld.exe next to btxd.exe, 60 s, stop
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          python "$CIPY" smoke --btxd bin/btxd.exe --cli bin/btx-cli.exe --datadir "$RUNNER_TEMP/smoke-helper" \
            --label winnative-helper --job "$GITHUB_JOB" --port 38353 --rpcport 38352 --linger 60 \
            --capture getmodelnetworkinfo --out "$LOGS"
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-win-native-smoke
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # Every suite test_btx --list_content shows, in 8 shards of the sorted list (2 at a time, 30 min each,
  # the limit repch1c used in #356). Run from the checkout root at the build path, because test_btx has
  # source and build/bin paths compiled in (src/test/CMakeLists.txt) and some suites look up files from
  # the working directory. TEMP is short, as it would be with -testdatadir.
  win-native-units:
    name: win-native-units (${{ matrix.shard }}/8)
    needs: [tools, win-native-tests]
    if: ${{ !cancelled() && needs.win-native-tests.outputs.test_btx == 'yes' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-2025
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 350
    env:
      MSYS_NO_PATHCONV: "1"
    steps:
      - name: Start (and keep checkout bytes, no CRLF conversion)
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs" /d/w/t
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: win-native-bin
          path: build/bin
      - name: test_btx shard ${{ matrix.shard }}/8 (balanced by measured seconds, 2 at a time, 1800 s per suite)
        env:
          TEMP: 'D:\w\t'
          TMP: 'D:\w\t'
        run: |
          python "$CIPY" suites --bin build/bin/test_btx.exe --label "winnative-s${{ matrix.shard }}" --job "$GITHUB_JOB" \
            --out "$LOGS/units" --include . --shard "${{ matrix.shard }}/8" --jobs 2 --timeout 1800 --keep-logs \
            --shard-costs contrib/ci-fork/unit-suite-seconds.tsv \
            --stop-at $((JOB_T0 + 335 * 60)) --stop-in 330
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: win-native-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # Second pass for the suites that hit 1800 s (or were not reached): 5400 s each, in 4 shards.
  win-native-retry:
    name: win-native-retry (${{ matrix.shard }}/4)
    needs: [tools, win-native-tests, win-native-units]
    if: ${{ !cancelled() && needs.win-native-tests.outputs.test_btx == 'yes' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-2025
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 350
    env:
      MSYS_NO_PATHCONV: "1"
    steps:
      - name: Start (and keep checkout bytes, no CRLF conversion)
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs" /d/w/t
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: win-native-bin
          path: build/bin
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: win-native-units-*
          path: ${{ runner.temp }}/pass1
      - name: Suites to retry (timeout, deadline or not reached in pass 1)
        run: |
          python "$CIPY" merge --label winnative-pass1 --out "$LOGS/pass1" --inputs "$RUNNER_TEMP/pass1/*/units/results.tsv" \
            --listed "$RUNNER_TEMP/pass1/*/units/listed.txt" --max-notices 2 --max-errors 2 || true
          { cat "$LOGS"/pass1/retry-timeout.txt "$LOGS"/pass1/retry-deadline.txt "$LOGS"/pass1/retry-not_run.txt 2>/dev/null || true; } \
            | sort -u > "$LOGS/retry-list.txt"
          python "$CIPY" ann notice "job=$GITHUB_JOB step=retry-list suites=$(wc -l < "$LOGS/retry-list.txt")"
      - name: Retry shard ${{ matrix.shard }}/4 (2 at a time, 5400 s per suite)
        env:
          TEMP: 'D:\w\t'
          TMP: 'D:\w\t'
        run: |
          if [ ! -s "$LOGS/retry-list.txt" ]; then echo "nothing to retry"; exit 0; fi
          python "$CIPY" suites --bin build/bin/test_btx.exe --label "winnative-r${{ matrix.shard }}" --job "$GITHUB_JOB" \
            --out "$LOGS/units" --include . --suites-file "$LOGS/retry-list.txt" --shard "${{ matrix.shard }}/4" \
            --jobs 2 --timeout 5400 --keep-logs --stop-at $((JOB_T0 + 335 * 60)) --stop-in 330
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: win-native-retry-${{ matrix.shard }}
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  win-native-summary:
    name: win-native-summary
    needs: [tools, win-native-units, win-native-retry]
    if: ${{ !cancelled() && needs.tools.result == 'success' }}
    runs-on: ubuntu-24.04
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: win-native-units-*
          path: ${{ runner.temp }}/pass1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: win-native-retry-*
          path: ${{ runner.temp }}/pass2
      - name: Merge pass 1 and pass 2 (pass 2 wins, a not-run never replaces a result)
        run: |
          CIPY="$RUNNER_TEMP/ci-tools/btx_ci.py"
          python3 "$CIPY" merge --label winnative-all --out "$RUNNER_TEMP/summary" \
            --inputs "$RUNNER_TEMP/pass1/*/units/results.tsv" "$RUNNER_TEMP/pass2/*/units/results.tsv" \
            --listed "$RUNNER_TEMP/pass1/*/units/listed.txt" || true
          if [ ! -f "$RUNNER_TEMP/summary/summary-all.json" ]; then echo "no shard results"; exit 0; fi
          python3 - "$RUNNER_TEMP/summary/summary-all.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("### Native Windows test_btx (all shards, both passes)\n")
          print("| status | suites |\n|---|---|")
          for k, v in sorted(d["counts"].items()):
              print(f"| {k} | {v} |")
          print(f"\nlisted={d['listed']} unaccounted={len(d['unaccounted'])} problems={len(d['problems'])}\n")
          for k, names in sorted(d["by_status"].items()):
              if k in ("fail", "crash", "timeout", "deadline", "not_run"):
                  print(f"**{k}** ({len(names)}): " + ", ".join(names[:200]) + "\n")
          PY
      - name: Upload the merged table
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: win-native-summary
          path: ${{ runner.temp }}/summary
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # Census only: cl.exe is expected to stop at unsigned __int128 (src/matmul/int8_field.h:148) and the
  # GCC overflow builtins (src/matmul/matmul_v4_rc_gkr_field.h). Same flags as repch1c's cl runs in #356
  # (Modelnet and ZMQ OFF); it never gates the run.
  win-native-cl:
    name: win-native-cl (census)
    needs: tools
    runs-on: windows-2025
    timeout-minutes: 240
    continue-on-error: true
    env:
      VCPKG_ROOT: 'D:\w\vcpkg'
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: 'clear;files,D:\w\vbc,read'
      MSYS_NO_PATHCONV: "1"
    steps:
      - name: Start (and keep checkout bytes, no CRLF conversion)
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs" /d/w/vbc
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: vcpkg tool at the pinned commit
        run: |
          if [ ! -d /d/w/vcpkg/.git ]; then git clone --no-checkout https://github.com/microsoft/vcpkg.git 'D:\w\vcpkg'; fi
          git -C 'D:\w\vcpkg' checkout --detach "$VCPKG_COMMIT"
          [ "$(git -C 'D:\w\vcpkg' rev-parse HEAD)" = "$VCPKG_COMMIT" ]
          python "$CIPY" msvc-run --job "$GITHUB_JOB" -- 'D:\w\vcpkg\bootstrap-vcpkg.bat' -disableMetrics
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\vbc
          key: vcpkg-bin-win-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-win-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-bin-win-static-
      - name: Configure with cl.exe (Ninja, x64-windows-static, Modelnet and ZMQ OFF)
        id: configure
        run: |
          python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-drop Strawberry -- cl 2> "$LOGS/cl-version.txt" || true
          python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-drop Strawberry -- \
            python "$CIPY" configure --name wincl --job "$GITHUB_JOB" --logs "$LOGS" --builddir build-cl -- \
            -S . -B build-cl -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            '-DCMAKE_TOOLCHAIN_FILE=D:\w\vcpkg\scripts\buildsystems\vcpkg.cmake' -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON -DVCPKG_MANIFEST_FEATURES=wallet -DVCPKG_INSTALLED_DIR=D:/w/vi \
            -DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=D:/w/vbt -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF -DWITH_MODELNET=OFF -DWITH_ZMQ=OFF -DENABLE_WALLET=ON
      - name: ninja -k 0 btxd with cl.exe
        timeout-minutes: 200
        run: |
          python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-drop Strawberry -- \
            python "$CIPY" build --name cl-btxd --logs "$LOGS" --builddir build-cl -- -k 0 -j"$(nproc)" btxd || true
      - name: Census (failed objects, first error of each, MSVC error codes)
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          python "$CIPY" build-summary --name cl-btxd --job "$GITHUB_JOB" --logs "$LOGS" --exe btxd=build-cl/bin/btxd.exe
          grep -E '^FAILED: ' "$LOGS/build-cl-btxd.log" | sed -E 's/^FAILED: (\[code=[0-9]+\] )?//' | sort > "$LOGS/cl-failed-objects.txt" || true
          grep -oE '[A-Za-z0-9_./\\-]+\.(h|hpp|cpp)\([0-9]+(,[0-9]+)?\): (fatal )?error C[0-9]{4}' "$LOGS/build-cl-btxd.log" \
            | sort | uniq -c | sort -rn | head -n 40 > "$LOGS/cl-error-sites.txt" || true
          python "$CIPY" ann notice "job=$GITHUB_JOB step=cl-census failed_objects=$(wc -l < "$LOGS/cl-failed-objects.txt") top_sites=$(head -n 5 "$LOGS/cl-error-sites.txt" | tr -s ' ' | tr '\n' ';' | cut -c1-500)"
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-win-native-cl
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # ------------------------------------------------------------------ Atlas on Windows (only where gui/atlas has its Cargo.lock)
  # cargo --locked: every crate is checked against the sha256 in gui/atlas/Cargo.lock. Rust 1.95.0 is the
  # gui/atlas/rust-toolchain.toml pin. NSIS: the runner image's makensis, if it has one; otherwise NOT_RUN.
  win-atlas:
    name: win-atlas
    needs: tools
    runs-on: windows-2025
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 120
    env:
      MSYS_NO_PATHCONV: "1"
    steps:
      - name: Start (and keep checkout bytes, no CRLF conversion)
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: Atlas in this tree?
        id: has
        run: |
          if [ -f gui/atlas/Cargo.lock ]; then
            echo "atlas=yes" >> "$GITHUB_OUTPUT"
          else
            echo "atlas=no" >> "$GITHUB_OUTPUT"
            python "$CIPY" ann notice "job=$GITHUB_JOB step=atlas status=not-in-this-tree"
          fi
      - name: Rust 1.95.0
        if: steps.has.outputs.atlas == 'yes'
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          (cd gui/atlas && rustc --version && cargo --version) | tee "$LOGS/atlas-toolchain.txt"
      - name: cargo test --locked -p btx-atlas-core
        if: steps.has.outputs.atlas == 'yes'
        run: |
          set +e
          (cd gui/atlas && cargo test --locked -p btx-atlas-core) > "$LOGS/atlas-core-test.log" 2>&1
          rc=$?
          set -e
          tail -n 30 "$LOGS/atlas-core-test.log"
          level=notice; [ "$rc" = 0 ] || level=error
          python "$CIPY" ann "$level" "job=$GITHUB_JOB step=atlas-core-test rc=$rc $(grep -E '^test result:' "$LOGS/atlas-core-test.log" | tr -s ' ' | tr '\n' ';' | cut -c1-400)"
          exit "$rc"
      - name: cargo build --locked --release -p btx-atlas
        id: build
        if: ${{ !cancelled() && steps.has.outputs.atlas == 'yes' }}
        run: |
          set +e
          (cd gui/atlas && cargo build --locked --release -p btx-atlas) > "$LOGS/atlas-build.log" 2>&1
          rc=$?
          set -e
          tail -n 30 "$LOGS/atlas-build.log"
          exe=no; [ -f gui/atlas/target/release/btx-atlas.exe ] && exe=yes
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          level=notice; [ "$rc" = 0 ] || level=error
          python "$CIPY" ann "$level" "job=$GITHUB_JOB step=atlas-build rc=$rc exe=$exe"
          exit "$rc"
      - name: Executable ACL (contrib/atlas/check_windows_acl.ps1, read-only, informational)
        if: ${{ !cancelled() && steps.build.outputs.exe == 'yes' }}
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -File ./contrib/atlas/check_windows_acl.ps1 ./gui/atlas/target/release/btx-atlas.exe *> "$env:LOGS/atlas-acl.txt"
          $code = $LASTEXITCODE
          Get-Content "$env:LOGS/atlas-acl.txt"
          python $env:CIPY ann notice "job=$env:GITHUB_JOB step=atlas-acl exit=$code (0 = no broad write grant; 1 = a broad group can write or replace it at this path)"
          exit 0
      - name: NSIS association regression (gui/atlas/tests/nsis_associations.py)
        if: ${{ !cancelled() && steps.has.outputs.atlas == 'yes' }}
        run: |
          m=""
          for c in "/c/Program Files (x86)/NSIS/makensis.exe" "/c/Program Files/NSIS/makensis.exe"; do
            if [ -f "$c" ]; then m="$c"; break; fi
          done
          if [ -z "$m" ]; then m=$(command -v makensis || true); fi
          if [ -z "$m" ]; then
            python "$CIPY" ann notice "job=$GITHUB_JOB step=atlas-nsis status=NOT_RUN reason=no-makensis-on-image"
            exit 0
          fi
          set +e
          python gui/atlas/tests/nsis_associations.py --makensis "$(cygpath -w "$m")" --out "$LOGS/atlas-nsis.json" > "$LOGS/atlas-nsis.txt" 2>&1
          rc=$?
          set -e
          cat "$LOGS/atlas-nsis.txt"
          level=notice; [ "$rc" = 0 ] || level=error
          python "$CIPY" ann "$level" "job=$GITHUB_JOB step=atlas-nsis rc=$rc makensis=$("$m" /VERSION 2>/dev/null | tr -d '\r') $(tr -s ' \r\n' ' ' < "$LOGS/atlas-nsis.txt" | cut -c1-500)"
          exit "$rc"
      - name: Open btx-atlas.exe for 30 s, screenshot, close
        if: ${{ !cancelled() && steps.build.outputs.exe == 'yes' }}
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./gui/atlas/target/release/btx-atlas.exe).Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          $p.Refresh()
          $alive = -not $p.HasExited
          $title = if ($alive) { $p.MainWindowTitle } else { "" }
          $exitCode = if ($alive) { "" } else { $p.ExitCode }
          $shot = "no"
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path $env:LOGS "atlas-open.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            $shot = "yes"
          } catch { $shot = "failed:" + $_.Exception.Message }
          $closed = ""
          if ($alive) {
            [void]$p.CloseMainWindow()
            if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force; $closed = "forced" } else { $closed = "closed" }
          }
          python $env:CIPY ann notice "job=$env:GITHUB_JOB step=atlas-open alive_after_30s=$alive title=$title exit=$exitCode close=$closed screenshot=$shot"
          Get-FileHash -Algorithm SHA256 $exe | Format-List | Out-File (Join-Path $env:LOGS "atlas-exe-sha256.txt")
          Copy-Item $exe (Join-Path $env:LOGS "btx-atlas.exe")
      - name: Upload logs (with btx-atlas.exe and the screenshot)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-win-atlas
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # ------------------------------------------------------------------ macOS arm64
  macos-build:
    name: macos-build
    needs: tools
    runs-on: macos-15
    continue-on-error: true  # measurement lane: not gating until it has been green once
    timeout-minutes: 350
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
            echo "CCACHE_DIR=$HOME/.ccache-btx"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: Install Homebrew dependencies
        run: |
          brew install ninja pkgconf libevent zeromq libomp openssl@3 ccache
          command -v cmake >/dev/null || brew install cmake
      - name: Pick Boost (the tree's depends pin unless the Boost >= 1.91 fix is in)
        id: boost
        run: |
          if grep -q 'struct CTxMemPoolEntry_Indices final : boost::multi_index::indexed_by' src/txmempool.h; then
            echo "mode=pinned" >> "$GITHUB_OUTPUT"
            if brew list --formula boost >/dev/null 2>&1; then brew uninstall --ignore-dependencies boost; fi
          else
            echo "mode=brew" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore pinned Boost headers
        id: boost-cache
        if: steps.boost.outputs.mode == 'pinned'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/boost-pin
          key: boost-headers-${{ env.BOOST_PIN_VER }}-v1
      - name: Fetch pinned Boost headers
        id: boost-fetch
        if: steps.boost.outputs.mode == 'pinned' && steps.boost-cache.outputs.cache-hit != 'true'
        run: |
          v="$BOOST_PIN_VER"; d="boost_${v//./_}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$d.tar.gz" "https://archives.boost.io/release/$v/source/$d.tar.gz"
          got=$(shasum -a 256 "$RUNNER_TEMP/$d.tar.gz" | cut -d' ' -f1)
          if [ "$got" != "$BOOST_PIN_SHA256" ]; then
            python3 "$CIPY" ann error "job=$GITHUB_JOB step=boost sha256-mismatch got=$got"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/$d.tar.gz" -C "$RUNNER_TEMP" "$d/boost"
          mkdir -p "$HOME/boost-pin/include"
          mv "$RUNNER_TEMP/$d/boost" "$HOME/boost-pin/include/boost"
      - name: Save pinned Boost headers
        if: steps.boost-fetch.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/boost-pin
          key: boost-headers-${{ env.BOOST_PIN_VER }}-v1
      - name: Install Homebrew Boost
        if: steps.boost.outputs.mode == 'brew'
        run: brew install boost
      - name: Restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-macos-${{ github.run_id }}-${{ github.run_attempt }}-build
          restore-keys: |
            ccache-macos-${{ github.run_id }}-
            ccache-macos-
      - name: Configure (Modelnet ON)
        id: configure
        env:
          BOOST_MODE: ${{ steps.boost.outputs.mode }}
        run: |
          prefix=$(brew --prefix)
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          args=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" -DWITH_MODELNET=ON
                -DWITH_ZMQ=ON -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DWITH_CCACHE=ON)
          if [ "$BOOST_MODE" = pinned ]; then args+=(-DBoost_INCLUDE_DIR="$HOME/boost-pin/include"); fi
          if ! xcrun -sdk macosx metal -v >/dev/null 2>&1; then args+=(-DBTX_MATMUL_METAL_PRECOMPILE_KERNELS=OFF); fi
          python3 "$CIPY" configure --name macos --job "$GITHUB_JOB" --logs "$LOGS" --builddir build -- "${args[@]}"
          python3 "$CIPY" ann notice "job=$GITHUB_JOB step=boost-mode mode=$BOOST_MODE xcode=$(xcodebuild -version | head -n 1 | tr ' ' '-') macos=$(sw_vers -productVersion)"
      - name: Build btxd and btx-cli
        timeout-minutes: 310
        run: python3 "$CIPY" build --name daemon --logs "$LOGS" --builddir build -- -k 0 -j"$(sysctl -n hw.ncpu)" btxd btx-cli
      - name: Build summary
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: python3 "$CIPY" build-summary --name daemon --job "$GITHUB_JOB" --logs "$LOGS" --exe btxd=build/bin/btxd btx_cli=build/bin/btx-cli
      - name: Save ccache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-macos-${{ github.run_id }}-${{ github.run_attempt }}-build
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-macos-build
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # Builds test_btx and the helpers once (the daemon's objects come from macos-build's ccache) and hands
