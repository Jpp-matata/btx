# Fork CI for btxchain/btx release-0.34.16, on a fork's branch ci-0.34.16 (and ci-0.34.16/<topic>).
#
# A fork-side gate for the release line. Not proposed upstream: upstream runs no GitHub-hosted CI
# by policy (.github/workflows/README.md), so a fork run is the evidence a pull request carries.
# The branch is release-0.34.16 plus one commit: this file, btx-0.34.16-coverage.yml and the helpers
# in contrib/ci-fork/. A topic branch ci-0.34.16/<topic> is that branch plus a PR's commits.
#
# Jobs
# - tools: selftests and shellcheck of contrib/ci-fork; hands btx_ci.py to every other job.
# - lint: each check of the repo's lint runner (test/lint/test_runner) and each test/lint/lint-*.py on
#   its own, yamllint on .github, and a scan of the lines the branch adds for keys and tokens.
# - clang-tidy-diff: src/.clang-tidy with the bitcoin-tidy plugin (LLVM 19) on the C++ lines the branch
#   changes against release-0.34.16; warnings are errors there.
# - cppcheck: cppcheck 2.13 on every product translation unit; red when an (id, file) count grows past
#   contrib/ci-fork/cppcheck-baseline.tsv, which only shrinks.
# - linux-build (all targets; the ctest entries outside test_btx; every test_btx suite registered in
#   ctest) -> linux-unit (6 shards) and linux-functional (4 shards); linux-userns (swarm suites with real
#   user namespaces). Shards are balanced by measured seconds (contrib/ci-fork/*-seconds.tsv); 900 s per
#   unit suite, and a suite that times out is rerun alone at the same 900 s. The 191
#   matmul_v4_rc_stage3_* suites stay out of the hosted Linux shards (macos-stage3-sample measures 20).
# - mingw-cross, mingw-tests, windows-smoke, windows-tests: the MinGW lane (cross build, native run).
# - win-native-*: the clang-cl lane (windows-clangcl-static preset); win-native-cl: a cl.exe census that
#   never gates; win-atlas: the Atlas desktop app. These lanes have not run yet: measurement first.
# - macos-build -> macos-tests-build -> macos-unit (3 shards), macos-swarm, macos-stage3-sample.
# - The MinGW, native Windows and macOS jobs are measurement lanes (continue-on-error) until each has been
#   green once; the gate is lint, clang-tidy-diff, cppcheck, the linux-* jobs, release-gate and summary.
# - release-gate: the release tooling's own tests (test/util/*release*_test.py).
# - summary: one known-failing verdict over every Linux result, and the next known-failing list.
#
# Rules
# - No secrets: the job token is read-only (permissions: contents: read); push and manual runs only,
#   no pull_request trigger.
# - Runs only outside btxchain/* and only on ci-0.34.16 and ci-0.34.16/* (guard on the tools job).
# - Third-party code: only actions/* pinned to full commit SHAs; the OpenSSL, Boost, ccache and
#   shellcheck downloads checked against fixed sha256 values; vcpkg at a pinned commit; the Python lint
#   tools at pinned versions; Ubuntu packages; crates checked against gui/atlas/Cargo.lock (--locked).
# - A test failure is red only when it is not in contrib/ci-fork/known-failing.txt
#   (kind | name | class | first failing line | seen on). The list only shrinks; the summary job writes
#   the next one. No timeout is raised and no test is skipped to make a job green.
# - Every result is an annotation titled RESULT, readable without a token via
#   GET /repos/{owner}/{repo}/check-runs/{id}/annotations.

name: btx-0.34.16 CI

on:
  workflow_dispatch:
  push:
    branches: ['ci-0.34.16', 'ci-0.34.16/**']

concurrency:
  group: btx-0.34.16-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_BRANCH: "release-0.34.16"
  UPSTREAM_URL: "https://github.com/btxchain/btx.git"
  OSSL_VER: "3.5.4"
  OSSL_SHA256: "967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99"
  BOOST_PIN_VER: "1.81.0"
  BOOST_PIN_SHA256: "205666dea9f6a7cfed87c7a6dfbeb52a2c1b9de55712c9c1a87735d7181452b6"
  # ccache 4.14.2 (18 Oct 2026); sha256 = the GitHub release asset digest of ccache-4.14.2-windows-x86_64.zip.
  CCACHE_WIN_VER: "4.14.2"
  CCACHE_WIN_SHA256: "6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84"
  # The vcpkg commit of the native Windows runs reported on #356 (3 Nov 2026); vcpkg.json's builtin-baseline
  # (c82f7466, 2024.09.30) still decides the port versions.
  VCPKG_COMMIT: "afa249f12f52ed8a3b919f195495ba8b330288d1"
  WIN_NATIVE_TARGETS: "btxd btx-cli btx-tx btx-util btx-modeld"
  # The pin of ci/lint/04_install.sh; sha256 of shellcheck-v0.8.0.linux.x86_64.tar.xz, checked 12 Nov 2026.
  SHELLCHECK_VER: "v0.8.0"
  SHELLCHECK_SHA256: "ab6ee1b178f014d1b86d1e24da20d1139656c8b0ed34d2867fbb834dad02bf0a"
  TIDY_LLVM_V: "19"
  UNIT_EXCLUDE: "^matmul_v4_rc_stage3_"
  KNOWN: "contrib/ci-fork/known-failing.txt"
  CCACHE_MAXSIZE: "2500M"
  CCACHE_COMPRESS: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_COMPILERCHECK: "content"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  LINUX_TEST_TARGETS: "test_btx btxd btx-cli btx-open btx-modeld btx-wallet btx-util btx-hcpd btx-tx btx-hosted"
  CORE_SUITES: "util_tests,crypto_tests,hash_tests,key_tests,base58_tests,bech32_tests,uint256_tests,arith_uint256_tests,serialize_tests,streams_tests,script_tests,transaction_tests,sighash_tests,coins_tests,mempool_tests,validation_tests,blockchain_tests,net_tests,addrman_tests,getarg_tests,fs_tests,sock_tests,pq_crypto_tests,wallet_tests,lightwatch_tests,lab_lifecycle_tests,nif_sandbox_tests,guard_permit_tests,native_discovery_tests,cap02_tests,hire01_tests,acc07_tests,fixture_cleanup_tests"
  GUARD_SUITES: "guard_permit_tests,native_discovery_tests,cap02_tests,hire01_tests,acc07_tests"

jobs:
  tools:
    name: tools
    # Every other job needs this one, so this guard keeps the whole workflow off upstream and off every
    # branch except ci-0.34.16 and ci-0.34.16/* (push or manual run).
    if: ${{ github.repository_owner != 'btxchain' && (github.ref_name == 'ci-0.34.16' || startsWith(github.ref_name, 'ci-0.34.16/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the CI helpers (selftests, shellcheck) and hand btx_ci.py on
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          python3 -m py_compile contrib/ci-fork/*.py
          python3 contrib/ci-fork/btx_ci.py selftest --job tools
          python3 contrib/ci-fork/coverage_check.py --selftest
          shellcheck contrib/ci-fork/*.sh
          mkdir -p ci-tools
          cp contrib/ci-fork/btx_ci.py ci-tools/btx_ci.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-tools
          path: ci-tools/btx_ci.py
          retention-days: 7
          overwrite: true

  # ------------------------------------------------------------------ static checks
  lint:
    name: lint
    needs: tools
    if: ${{ !cancelled() && needs.tools.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: Fetch the release line and find where this branch leaves it
        run: |
          git fetch --no-tags --quiet "$UPSTREAM_URL" "+refs/heads/$RELEASE_BRANCH:refs/remotes/upstream/$RELEASE_BRANCH"
          base=$(git merge-base HEAD "upstream/$RELEASE_BRANCH")
          echo "BRANCH_BASE=$base" >> "$GITHUB_ENV"
          python3 "$CIPY" ann notice "job=$GITHUB_JOB step=base base=${base:0:12} release_head=$(git rev-parse --short=12 "upstream/$RELEASE_BRANCH") commits_on_top=$(git rev-list --count "$base..HEAD")"
      - name: Install the lint tools (the pins of ci/lint/04_install.sh where Python 3.12 allows)
        run: |
          python3 -m venv "$RUNNER_TEMP/lintvenv"
          "$RUNNER_TEMP/lintvenv/bin/pip" install -q --disable-pip-version-check codespell==2.2.6 lief==0.14.1 mypy==1.4.1 \
            pyzmq==25.1.0 ruff==0.5.5 vulture==2.6 yamllint==1.35.1
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VER/shellcheck-$SHELLCHECK_VER.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/lintbin"
          cp "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VER/shellcheck" "$RUNNER_TEMP/lintbin/"
          echo "$RUNNER_TEMP/lintbin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/lintvenv/bin" >> "$GITHUB_PATH"
          (cd test/lint/test_runner && CARGO_TARGET_DIR="$RUNNER_TEMP/lint-target" cargo build -q)
      - name: Every lint check on its own
        run: |
          shellcheck --version | sed -n 2p
          COMMIT_RANGE="$BRANCH_BASE..HEAD" bash contrib/ci-fork/lint.sh "$RUNNER_TEMP/lint-target/debug/test_runner" "$LOGS/lint"
      - name: Lints that fail on the release base too - new output lines only
        run: |
          python3 "$CIPY" lint-diff --runner "$RUNNER_TEMP/lint-target/debug/test_runner" --results "$LOGS/lint/lint-results.tsv" \
            --logs "$LOGS/lint/logs" --base "$BRANCH_BASE" --known "$KNOWN" --out "$RUNNER_TEMP/lint-base"
          mkdir -p "$LOGS/lint/base"
          cp "$RUNNER_TEMP"/lint-base/*.txt "$RUNNER_TEMP"/lint-base/*.log "$LOGS/lint/base/" 2>/dev/null || true
      - name: yamllint on .github
        run: |
          t0=$(date +%s)
          rc=0
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' .github > "$LOGS/lint/logs/yamllint.log" 2>&1 || rc=$?
          st=pass
          [ "$rc" -eq 0 ] || st=fail
          printf 'yamllint\t%s\t%s\n' "$st" "$(( $(date +%s) - t0 ))" >> "$LOGS/lint/lint-results.tsv"
          cat "$LOGS/lint/logs/yamllint.log"
      - name: Scan the lines this branch adds for keys and tokens
        run: python3 "$CIPY" secrets --base "$BRANCH_BASE" --label secrets
      - name: Known-failing gate
        if: ${{ !cancelled() }}
        run: |
          python3 "$CIPY" known --label lint --known "$KNOWN" --out "$LOGS/gate" --lint "$LOGS/lint/lint-results.tsv"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: res-lint
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  clang-tidy-diff:
    name: clang-tidy-diff
    needs: tools
    if: ${{ !cancelled() && needs.tools.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: Fetch the release line and find where this branch leaves it
        run: |
          git fetch --no-tags --quiet "$UPSTREAM_URL" "+refs/heads/$RELEASE_BRANCH:refs/remotes/upstream/$RELEASE_BRANCH"
          base=$(git merge-base HEAD "upstream/$RELEASE_BRANCH")
          echo "BRANCH_BASE=$base" >> "$GITHUB_ENV"
          n=$(git diff --name-only "$base" HEAD -- 'src/*.cpp' 'src/*.h' | wc -l)
          echo "CPP_CHANGED=$n" >> "$GITHUB_ENV"
          python3 "$CIPY" ann notice "job=$GITHUB_JOB step=base base=${base:0:12} changed_cpp_files=$n"
      - name: Install LLVM 19 and the build dependencies
        if: env.CPP_CHANGED != '0'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-19 clang-tidy-19 libclang-19-dev llvm-19-dev \
            cmake ninja-build pkgconf python3 libevent-dev libboost-dev libsqlite3-dev libzmq3-dev
      - name: Restore OpenSSL
        if: env.CPP_CHANGED != '0'
        id: ossl-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/ossl35
          key: openssl-${{ env.OSSL_VER }}-ubuntu24-x64-v2
      - name: Build static OpenSSL
        id: ossl-build
        if: env.CPP_CHANGED != '0' && steps.ossl-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          u="https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz"
          curl -fsSL --retry 3 -o ossl.tar.gz "$u"
          got=$(sha256sum ossl.tar.gz | cut -d' ' -f1)
          if [ "$got" != "$OSSL_SHA256" ]; then
            python3 "$CIPY" ann error "job=$GITHUB_JOB step=openssl sha256-mismatch got=$got"
            exit 1
          fi
          tar xzf ossl.tar.gz
          cd "openssl-$OSSL_VER"
          ./Configure --prefix="$HOME/ossl35" --libdir=lib no-shared no-tests no-docs -fPIC > "$LOGS/ossl-configure.log" 2>&1
          make -j"$(nproc)" > "$LOGS/ossl-make.log" 2>&1
          make install_sw install_ssldirs > "$LOGS/ossl-install.log" 2>&1
      - name: Save OpenSSL
        if: steps.ossl-build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/ossl35
          key: openssl-${{ env.OSSL_VER }}-ubuntu24-x64-v2
      - name: Build the bitcoin-tidy plugin
        if: env.CPP_CHANGED != '0'
        run: |
          cmake -S contrib/devtools/bitcoin-tidy -B "$RUNNER_TEMP/tidy-plugin" -G Ninja \
            -DLLVM_DIR="/usr/lib/llvm-$TIDY_LLVM_V/cmake" -DCMAKE_BUILD_TYPE=Release > "$LOGS/plugin.log" 2>&1
          cmake --build "$RUNNER_TEMP/tidy-plugin" -j"$(nproc)" >> "$LOGS/plugin.log" 2>&1
      - name: Configure with clang 19 (-O0 -g0, compile database) and generate the headers
        if: env.CPP_CHANGED != '0'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER="clang-$TIDY_LLVM_V" -DCMAKE_CXX_COMPILER="clang++-$TIDY_LLVM_V" \
            "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O0 -g0" "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O0 -g0" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=ON -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DWITH_ZMQ=ON \
            -DWITH_MODELNET=ON -DOPENSSL_ROOT_DIR="$HOME/ossl35" -DOPENSSL_USE_STATIC_LIBS=ON \
            -DBTX_ENABLE_CUDA_EXPERIMENTAL=OFF -DWITH_CCACHE=OFF > "$LOGS/configure.log" 2>&1
          bash contrib/ci-fork/gen-headers.sh build > "$LOGS/gen-headers.log" 2>&1
      - name: clang-tidy on the changed lines
        run: |
          rc=0
          bash contrib/ci-fork/tidy-diff.sh "$BRANCH_BASE" build "$RUNNER_TEMP/tidy-plugin/libbitcoin-tidy.so" "$LOGS/tidy" "$(nproc)" || rc=$?
          n=$(wc -l < "$LOGS/tidy/findings.txt")
          while IFS= read -r f; do
            python3 "$CIPY" ann error "job=$GITHUB_JOB ${f#"$GITHUB_WORKSPACE"/}"
          done < <(head -n 8 "$LOGS/tidy/findings.txt")
          lvl=notice
          [ "$rc" -eq 0 ] || lvl=error
          python3 "$CIPY" ann "$lvl" "job=$GITHUB_JOB step=tidy-diff base=${BRANCH_BASE:0:12} llvm=$TIDY_LLVM_V findings_on_changed_lines=$n rc=$rc"
          exit "$rc"
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-clang-tidy-diff
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  cppcheck:
    name: cppcheck
    needs: tools
    if: ${{ !cancelled() && needs.tools.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: Install cppcheck and the build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cppcheck build-essential cmake ninja-build pkgconf python3 \
            libevent-dev libboost-dev libsqlite3-dev libzmq3-dev
          cppcheck --version
      - name: Restore OpenSSL
        id: ossl-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/ossl35
          key: openssl-${{ env.OSSL_VER }}-ubuntu24-x64-v2
      - name: Build static OpenSSL
        id: ossl-build
        if: steps.ossl-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          u="https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz"
          curl -fsSL --retry 3 -o ossl.tar.gz "$u"
          got=$(sha256sum ossl.tar.gz | cut -d' ' -f1)
          if [ "$got" != "$OSSL_SHA256" ]; then
            python3 "$CIPY" ann error "job=$GITHUB_JOB step=openssl sha256-mismatch got=$got"
            exit 1
          fi
          tar xzf ossl.tar.gz
          cd "openssl-$OSSL_VER"
          ./Configure --prefix="$HOME/ossl35" --libdir=lib no-shared no-tests no-docs -fPIC > "$LOGS/ossl-configure.log" 2>&1
          make -j"$(nproc)" > "$LOGS/ossl-make.log" 2>&1
          make install_sw install_ssldirs > "$LOGS/ossl-install.log" 2>&1
      - name: Save OpenSSL
        if: steps.ossl-build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/ossl35
          key: openssl-${{ env.OSSL_VER }}-ubuntu24-x64-v2
      - name: Configure (gcc, compile database) and generate the headers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=ON \
            -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DWITH_ZMQ=ON -DWITH_MODELNET=ON -DOPENSSL_ROOT_DIR="$HOME/ossl35" \
            -DOPENSSL_USE_STATIC_LIBS=ON -DBTX_ENABLE_CUDA_EXPERIMENTAL=OFF -DWITH_CCACHE=OFF > "$LOGS/configure.log" 2>&1
          bash contrib/ci-fork/gen-headers.sh build > "$LOGS/gen-headers.log" 2>&1
      - name: cppcheck on every product translation unit, against the baseline
        run: |
          rc=0
          python3 "$CIPY" cppcheck --src . --build build --out "$RUNNER_TEMP/cpp" --jobs "$(nproc)" \
            --baseline contrib/ci-fork/cppcheck-baseline.tsv --write-baseline "$RUNNER_TEMP/cpp/cppcheck-baseline.next.tsv" || rc=$?
          mkdir -p "$LOGS/cppcheck"
          cp "$RUNNER_TEMP"/cpp/*.tsv "$LOGS/cppcheck/"
          exit "$rc"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-cppcheck
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # ------------------------------------------------------------------ Linux
  linux-build:
    name: linux-build
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      bin: ${{ steps.pack.outputs.bin }}
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
            echo "CCACHE_DIR=$HOME/.ccache-btx"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: Free disk space
        run: |
          df -h / | tail -n 1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -n 1
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential cmake ninja-build pkgconf python3 python3-zmq ccache \
            libevent-dev libboost-dev libsqlite3-dev libzmq3-dev
      - name: Restore OpenSSL
        id: ossl-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/ossl35
          key: openssl-${{ env.OSSL_VER }}-ubuntu24-x64-v2
      - name: Build static OpenSSL
        id: ossl-build
        if: steps.ossl-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          u="https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz"
          curl -fsSL --retry 3 -o ossl.tar.gz "$u"
          curl -fsSL --retry 3 -o ossl.tar.gz.sha256 "$u.sha256"
          got=$(sha256sum ossl.tar.gz | cut -d' ' -f1)
          want=$(awk '{print $1}' ossl.tar.gz.sha256)
          if [ "$got" != "$OSSL_SHA256" ] || [ "$got" != "$want" ]; then
            python3 "$CIPY" ann error "job=$GITHUB_JOB step=openssl sha256-mismatch got=$got"
            exit 1
          fi
          tar xzf ossl.tar.gz
          cd "openssl-$OSSL_VER"
          ./Configure --prefix="$HOME/ossl35" --libdir=lib no-shared no-tests no-docs -fPIC > "$LOGS/ossl-configure.log" 2>&1
          make -j"$(nproc)" > "$LOGS/ossl-make.log" 2>&1
          make install_sw install_ssldirs > "$LOGS/ossl-install.log" 2>&1
          "$HOME/ossl35/bin/openssl" list -signature-algorithms | grep -qi 'ml-dsa-44'
          python3 "$CIPY" ann notice "job=$GITHUB_JOB step=openssl built=$OSSL_VER sha256=pinned-match ml-dsa-44=listed"
      - name: Save OpenSSL
        if: steps.ossl-build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/ossl35
          key: openssl-${{ env.OSSL_VER }}-ubuntu24-x64-v2
      - name: Restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-linux-r3416-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-linux-r3416-${{ github.run_id }}-
            ccache-linux-r3416-
      - name: Configure (Modelnet ON, tests ON)
        id: configure
        run: |
          python3 "$CIPY" configure --name linux --job "$GITHUB_JOB" --logs "$LOGS" --builddir build -- \
            -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_MODELNET=ON -DBUILD_TESTS=ON -DBUILD_GUI=OFF \
            -DBUILD_BENCH=OFF -DWITH_ZMQ=ON -DWITH_CCACHE=ON -DOPENSSL_ROOT_DIR="$HOME/ossl35" -DOPENSSL_USE_STATIC_LIBS=ON \
            -DBTX_ENABLE_CUDA_EXPERIMENTAL=OFF
          grep -E '^OPENSSL_(SSL|CRYPTO)_LIBRARY' build/CMakeCache.txt
      - name: Build every target (keep going)
        timeout-minutes: 320
        run: python3 "$CIPY" build --name all --logs "$LOGS" --builddir build -- -k 0 -j"$(nproc)"
      - name: Build summary
        id: bsum
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          python3 "$CIPY" build-summary --name all --job "$GITHUB_JOB" --logs "$LOGS" \
            --exe btxd=build/bin/btxd btx_cli=build/bin/btx-cli test_btx=build/bin/test_btx
      - name: Save ccache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-linux-r3416-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Every test_btx suite is a ctest entry; run the ctest entries outside test_btx
        if: ${{ !cancelled() && steps.bsum.outputs.test_btx == 'yes' }}
        timeout-minutes: 40
        env:
          OMP_NUM_THREADS: "2"
        run: |
          export BTX_OPENSSL="$HOME/ossl35/bin/openssl" OPENSSL_CONF="$HOME/ossl35/ssl/openssl.cnf"
          build/bin/test_btx --list_content 2>&1 | sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)\*\{0,1\}[[:space:]]*$/\1/p' | sort -u > "$LOGS/test_btx-suites.txt"
          ctest --test-dir build -N | sed -n 's/^ *Test *#[0-9]*: //p' | sort -u > "$LOGS/ctest-names.txt"
          comm -23 "$LOGS/test_btx-suites.txt" "$LOGS/ctest-names.txt" > "$LOGS/unregistered.txt"
          comm -13 "$LOGS/test_btx-suites.txt" "$LOGS/ctest-names.txt" > "$LOGS/ctest-extra.txt"
          unreg=$(wc -l < "$LOGS/unregistered.txt")
          lvl=notice
          [ "$unreg" -eq 0 ] || lvl=error
          python3 "$CIPY" ann "$lvl" "job=$GITHUB_JOB step=registration test_btx_suites=$(wc -l < "$LOGS/test_btx-suites.txt") ctest_entries=$(wc -l < "$LOGS/ctest-names.txt") unregistered=$unreg first=$(head -n 20 "$LOGS/unregistered.txt" | paste -sd, -)"
          ctest --test-dir build -R "^($(paste -sd'|' "$LOGS/ctest-extra.txt"))\$" --timeout 900 -j 2 \
            --output-junit "$LOGS/ctest-extra.xml" > "$LOGS/ctest-extra.log" 2>&1 || true
          tail -n 15 "$LOGS/ctest-extra.log"
          gate=0
          python3 "$CIPY" known --label linux-ctest-extra --known "$KNOWN" --out "$LOGS/gate-ctest" --junit "$LOGS/ctest-extra.xml" || gate=$?
          [ "$unreg" -eq 0 ] && [ "$gate" -eq 0 ]
      - name: Pack the binaries and the test tree for the test jobs
        id: pack
        if: ${{ !cancelled() && steps.bsum.outputs.test_btx == 'yes' && steps.bsum.outputs.btxd == 'yes' }}
        run: |
          tar -cf "$RUNNER_TEMP/linux-bin.tar" build/bin build/test
          ls -la "$RUNNER_TEMP/linux-bin.tar"
          echo "bin=yes" >> "$GITHUB_OUTPUT"
      - name: Upload the binaries
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-bin
          path: ${{ runner.temp }}/linux-bin.tar
          retention-days: 3
          overwrite: true
      - name: Upload results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: res-linux-build
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  linux-unit:
    name: linux-unit (${{ matrix.shard }}/6)
    needs: [tools, linux-build]
    if: ${{ !cancelled() && needs.linux-build.outputs.bin == 'yes' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-bin
          path: ${{ runner.temp }}
      - name: Unpack the binaries; runtime libraries; the thread shim
        run: |
          tar -xf "$RUNNER_TEMP/linux-bin.tar" && rm -f "$RUNNER_TEMP/linux-bin.tar"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libevent-dev libsqlite3-dev libzmq3-dev
          gcc -shared -fPIC -O2 -o "$RUNNER_TEMP/libhwc.so" contrib/ci-fork/hwc.c
      - name: Restore OpenSSL (tests that mint ML-DSA-44 certificates run its openssl)
        id: ossl-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/ossl35
          key: openssl-${{ env.OSSL_VER }}-ubuntu24-x64-v2
      - name: Shard ${{ matrix.shard }}/6 of test_btx (balanced by measured seconds, 2 at a time, 900 s per suite)
        id: units
        env:
          OMP_NUM_THREADS: "2"
          OMP_WAIT_POLICY: "PASSIVE"
          BTX_HWC: "2"
        run: |
          [ -x "$HOME/ossl35/bin/openssl" ] && export BTX_OPENSSL="$HOME/ossl35/bin/openssl" OPENSSL_CONF="$HOME/ossl35/ssl/openssl.cnf" \
            BTX_BCP1_OPENSSL="$HOME/ossl35/bin/openssl"
          export LD_PRELOAD="$RUNNER_TEMP/libhwc.so"
          python3 "$CIPY" suites --bin build/bin/test_btx --label "linux-unit-${{ matrix.shard }}" --job "$GITHUB_JOB" \
            --out "$LOGS/units" --include . --exclude "$UNIT_EXCLUDE" --serial '^pq_timing_tests$' \
            --shard "${{ matrix.shard }}/6" --shard-costs contrib/ci-fork/unit-suite-seconds.tsv \
            --jobs 2 --timeout 900 --keep-logs --stop-at $((JOB_T0 + 110 * 60)) --stop-in 105 || true
      - name: Rerun each suite that timed out, alone, at the same 900 s
        if: ${{ !cancelled() && steps.units.outcome == 'success' }}
        env:
          OMP_NUM_THREADS: "2"
          OMP_WAIT_POLICY: "PASSIVE"
          BTX_HWC: "2"
        run: |
          [ -x "$HOME/ossl35/bin/openssl" ] && export BTX_OPENSSL="$HOME/ossl35/bin/openssl" OPENSSL_CONF="$HOME/ossl35/ssl/openssl.cnf" \
            BTX_BCP1_OPENSSL="$HOME/ossl35/bin/openssl"
          export LD_PRELOAD="$RUNNER_TEMP/libhwc.so"
          awk -F'\t' 'NR > 1 && $4 == "timeout" {print $2}' "$LOGS/units/results.tsv" | sort -u > "$LOGS/retry-list.txt"
          if [ -s "$LOGS/retry-list.txt" ]; then
            python3 "$CIPY" suites --bin build/bin/test_btx --label "linux-unit-${{ matrix.shard }}-retry" --job "$GITHUB_JOB" \
              --out "$LOGS/retry" --include . --suites-file "$LOGS/retry-list.txt" --jobs 1 --timeout 900 --keep-logs \
              --stop-at $((JOB_T0 + 145 * 60)) --stop-in 38 || true
          fi
      - name: Known-failing gate
        if: ${{ !cancelled() }}
        run: |
          python3 "$CIPY" known --label "linux-unit-${{ matrix.shard }}" --known "$KNOWN" --out "$LOGS/gate" \
            --unit "$LOGS/units/results.tsv" "$LOGS/retry/results.tsv"
      - name: Upload results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: res-linux-unit-${{ matrix.shard }}
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

