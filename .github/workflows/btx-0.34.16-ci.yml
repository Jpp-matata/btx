            --tmpdirprefix "$RUNNER_TEMP/ft" --stop-in 165 -- --combinedlogslen=40
      - name: Known-failing gate
        if: ${{ !cancelled() }}
        run: |
          python3 "$CIPY" known --label "linux-func-${{ matrix.shard }}" --known "$KNOWN" --out "$LOGS/gate" \
            --functional "$LOGS/func/functional-results.csv"
      - name: Upload results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
